[project]
name = "oncall-rag"
version = "0.1.0"
description = "Runbook RAG assistant for on-call engineers"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "anthropic>=0.39.0",
]

[project.scripts]
oncall-rag = "oncall_rag.__main__:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
